<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TWX Code Analyzer API</title>
<link rel="stylesheet" href="swagger-ui.css">
<style>body { margin: 0; } .topbar { display: none; } .banner { font: 14px system-ui, sans-serif; background: #212529; color: #fff; padding: 10px 20px; } .banner a { color: #9ec5fe; }</style>
</head>
<body>
<div class="banner">TWX Code Analyzer API - <a href="../">back to the application</a> - authenticate with a session cookie (browser), a personal access token (<code>Authorization: Bearer ...</code>) or the container's security.</div>
<div id="swagger-ui"></div>
<script src="swagger-ui-bundle.js"></script>
<script src="swagger-ui-standalone-preset.js"></script>
<script>
window.onload = function () { window.ui = SwaggerUIBundle({ url: '../api/openapi.json', dom_id: '#swagger-ui', deepLinking: true, presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset], layout: 'BaseLayout', requestInterceptor: function (r) { return r; } }); };
</script>
</body>
</html>
